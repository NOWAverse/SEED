# NOWA · регистрация Планеты · уровень 1
# Уровень 1 — про ИИ-систему (AIOS) и её архитектуру, а не про бизнес. О бизнесе — одна строка.
# Меняется только решением Совета NOWA; версия растёт при любом изменении полей.

kind = "planet"
level = 1
version = 1
header = "# NOWA planet L1 v1"
section = "Planet"
max_chars = 3000
purpose = "По этому уровню другие Правители понимают, как устроена твоя ИИ-система, и находят решения, которые можно перенять."
visible_to = "администраторы NOWA (рецензенты); после одобрения — граждане NOWA с Планетой на карте"

[[field]]
label = "ID гражданина"
required = true
max = 8
pattern = '^C\d{3}$'
ask = "Какой у тебя ID гражданина? Его прислал бот после одобрения гражданства (вида C001)."
hint = "Вида C001."

[[field]]
label = "Название Планеты"
required = true
max = 60
ask = "Как называется твоя ИИ-система?"
hint = "Название системы, не компании."

[[field]]
label = "Что делает система"
required = true
max = 240
ask = "Что делает твоя система — одной-двумя фразами?"
hint = "Её работа, а не бизнес."

[[field]]
label = "Какой бизнес координирует"
required = true
max = 160
ask = "Какой бизнес она координирует — одной фразой, без цифр?"
hint = "Только одна строка. Без выручки, клиентов, цен и объёмов."

[[field]]
label = "Архитектура"
required = true
max = 600
ask = "Как информация проходит через систему — от входа до выводов и действий? 3–5 шагов."
hint = "Слои и шаги, без названий сервисов и адресов."

[[field]]
label = "Источники данных"
required = false
max = 200
ask = "Откуда система берёт данные? Только типы."
hint = "«почта, звонки, маркетплейс, учётная система» — без названий аккаунтов."

[[field]]
label = "Модели"
required = true
max = 200
ask = "Какие модели ИИ работают: локальные, облачные или смешанно — и для чего?"
hint = "Тип и назначение. Названия и размеры моделей не обязательны."

[[field]]
label = "ИИ-роли и агенты"
required = false
max = 240
ask = "Сколько у системы ИИ-ролей или агентов и какие они?"
hint = "Например: «4 — аналитик, разработчик, секретарь, контролёр»."

[[field]]
label = "Где работает"
required = false
max = 120
ask = "Где работает система: свой сервер, облако, ноутбук, сервис?"
hint = "Без адресов и имён хостов."

[[field]]
label = "ИИ сам / только с человеком"
required = true
max = 300
ask = "Что система делает сама, а что только после твоего «да»?"
hint = "Граница автономии — самое ценное для других Планет."

[[field]]
label = "Уровень (0–5)"
required = true
max = 120
pattern = '^[0-5]\b'
ask = "Уровень системы по шкале 0–5?"
hint = "Та же шкала, что у гражданина: 0 — нет ИИ … 5 — часть действий автоматически под контролем человека."

[[field]]
label = "Чем силён"
required = false
max = 300
ask = "Что в архитектуре твоей системы можешь показать и рассказать другим?"
hint = "1–3 пункта."

[[field]]
label = "Что строю сейчас"
required = false
max = 200
ask = "Какой следующий шаг системы ты строишь сейчас?"
hint = "Одна-две фразы."

[[field]]
label = "Вопросы к другим Планетам"
required = false
max = 300
ask = "Какие 1–3 вопроса ты хочешь задать другим Планетам?"
hint = "Через «;»."

# NOWA · анкета гражданина · уровень 1
# Единый источник для интервью бота и проверки кодом; SEED templates/ совпадают по полям (тест).
# Меняется только решением Совета NOWA; версия растёт при любом изменении полей.

kind = "citizen"
level = 1
version = 1
header = "# NOWA citizen L1 v1"
section = "Citizen"
max_chars = 2500
purpose = "По этому уровню NOWA подбирает человеку полезные знакомства. Поэтому «Могу дать» и «Ищу» — конкретно."
visible_to = "администраторы NOWA (рецензенты); после одобрения — граждане NOWA, открывшие уровень 1"

[[field]]
label = "Имя"
required = true
max = 60
ask = "Как тебя называть в NOWA? Имя или ник — как удобно."
hint = "Имя, имя с инициалом или ник. Фамилия не обязательна."

[[field]]
label = "Город"
required = true
max = 60
ask = "В каком городе или регионе ты живёшь или работаешь?"
hint = "Город или регион, без адреса."

[[field]]
label = "Языки"
required = false
max = 60
ask = "На каких языках тебе удобно общаться?"
hint = "Например: русский, English."

[[field]]
label = "Роль"
required = true
max = 80
ask = "Кто ты в своём бизнесе?"
hint = "Основатель, совладелец, операционный директор…"

[[field]]
label = "Бизнес одной фразой"
required = true
max = 160
ask = "Что делает твой бизнес и для кого — одной фразой, без цифр?"
hint = "Без выручки, цен, клиентов и названий компаний."

[[field]]
label = "Уровень ИИ-системы (0–5)"
required = true
max = 120
pattern = '^[0-5]\b'
ask = "Насколько ИИ уже работает в твоём бизнесе? Выбери цифру 0–5."
hint = "0 — не использую · 1 — чат-ассистент · 2 — агенты под задачи · 3 — данные бизнеса в базе, ИИ по ним отвечает · 4 — ИИ готовит выводы и решения · 5 — часть действий автоматически под контролем человека."

[[field]]
label = "Сильные стороны"
required = false
max = 200
ask = "За чем к тебе обычно приходят люди?"
hint = "1–2 строки."

[[field]]
label = "Могу дать"
required = true
max = 300
min_items = 3
ask = "Чем ты можешь помочь другим участникам? Назови 3 конкретные вещи."
hint = "3 пункта через «;». Конкретно: «опыт найма операторов поддержки», а не «интересные знакомства»."

[[field]]
label = "Ищу"
required = true
max = 300
min_items = 3
ask = "Что или кого ты ищешь в NOWA? 3 конкретные вещи."
hint = "3 пункта через «;»."

[[field]]
label = "Зачем мне NOWA"
required = true
max = 200
ask = "Зачем тебе NOWA — своими словами, одной-двумя фразами?"
hint = "Что должно измениться для тебя через 3 месяца."

[[field]]
label = "Интересы вне бизнеса"
required = false
max = 200
ask = "Чем ты увлекаешься вне работы? 3–5 вещей."
hint = "Интересы тоже соединяют людей."

[[field]]
label = "Формат встреч"
required = false
max = 120
ask = "Как тебе удобнее встречаться с участниками?"
hint = "Онлайн / офлайн и где."

[[field]]
label = "Кто рекомендовал"
required = false
max = 80
ask = "Кто рассказал тебе о NOWA? Если никто — так и скажи."
hint = "Ник или ID гражданина. Можно «не указано»."
